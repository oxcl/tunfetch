[package]
name = "tunfetch-wasm"
version = "0.1.0"
edition = "2021"
authors = ["oxcl <oxcl@proton.me>"]
repository = "https://github.com/oxcl/tunfetch"
description = "Drop-in fetch() replacement for Cloudflare Workers with SOCKS5 and HTTP proxy support built with Rust and WASM"
license = "LGPLv3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8" }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.103", features = ["console"] }
